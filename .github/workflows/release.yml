name: Linux AppImage
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  RUSTUP_TOOLCHAIN: "1.99.1"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev squashfs-tools desktop-file-utils
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Validate tag and application version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 tools/check_release_version.py
      - name: Tests
        run: make test
      - name: Package
        run: make appimage
      - name: Original-release firmware audio smoke
        run: python3 tools/firmware_smoke.py
      - name: Test standalone commands
        run: |
          (cd /tmp && APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/dist/Tonequay-x86_64.AppImage" --version)
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tonequay-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifacts and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name Tonequay-linux-x86_64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          printf '%s\n' 'Native Linux x86-64 preview. No firmware is bundled.' 'Review compatibility and license notices before publishing.' > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Tonequay $RELEASE_TAG" --notes-file release-notes.md dist/Tonequay-x86_64.AppImage dist/tonequay dist/Tonequay-Licenses.tar.gz dist/SHA256SUMS
