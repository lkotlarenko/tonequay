[package]
name = "tonequay"
description = "A native Linux workstation for M-VAVE FM-1 firmware"
repository = "https://github.com/lkotlarenko/tonequay"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
fm1-core = { path = "../fm1-core" }
fm1-soc = { path = "../fm1-soc" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
cpal = "=0.15.3"
midir = "=0.10.4"
rtrb = "=0.3.6"
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "=0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
